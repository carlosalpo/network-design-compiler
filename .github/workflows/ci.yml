name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          pytest -q
      - name: Exercise design compilation scenarios
        run: python scripts/check_examples.py --output reports/example-matrix
      - uses: actions/upload-artifact@v4
        with:
          name: design-packages-py${{ matrix.python }}
          path: reports/example-matrix/
          retention-days: 7
